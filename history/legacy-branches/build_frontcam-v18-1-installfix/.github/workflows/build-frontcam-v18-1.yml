name: Build FrontCamera v18.1 installfix

on:
  push:
    branches:
      - build/frontcam-v18-1-installfix
    paths:
      - ".github/workflows/build-frontcam-v18-1.yml"
      - "tools/frontcam-v18/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle -p tools/frontcam-v18 :app:assembleDebug --stacktrace

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          APK="tools/frontcam-v18/app/build/outputs/apk/debug/app-debug.apk"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK" | tee tools/frontcam-v18/APK-VERIFY-v181.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | tee tools/frontcam-v18/APK-BADGING-v181.txt
          sha256sum "$APK" | tee tools/frontcam-v18/APK-SHA256-v181.txt
          grep -F "package: name='kr.song.peugeot.frontautov181'" tools/frontcam-v18/APK-BADGING-v181.txt
          grep -F "sdkVersion:'21'" tools/frontcam-v18/APK-BADGING-v181.txt
          grep -F "targetSdkVersion:'27'" tools/frontcam-v18/APK-BADGING-v181.txt

      - name: Persist exact APK without Actions artifact quota
        shell: bash
        run: |
          set -euo pipefail
          APK="tools/frontcam-v18/app/build/outputs/apk/debug/app-debug.apk"
          OUT="build-artifacts/frontcam-v18-1"
          mkdir -p "$OUT"
          base64 -w0 "$APK" > "$OUT/CMZX-FrontCamera-v18.1-BACKGROUND-AUTO-INSTALLFIX.apk.b64"
          cp tools/frontcam-v18/APK-SHA256-v181.txt "$OUT/"
          cp tools/frontcam-v18/APK-BADGING-v181.txt "$OUT/"
          cp tools/frontcam-v18/APK-VERIFY-v181.txt "$OUT/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No build changes"
          else
            git commit -m "Persist v18.1 installfix exact build"
            git push
          fi
