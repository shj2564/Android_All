plugins { id "com.android.application" }

android {
    namespace "kr.song.peugeot.frontviewv14"
    compileSdk 35

    defaultConfig {
        applicationId "kr.song.peugeot.frontviewv14"
        minSdk 21
        targetSdk 27
        versionCode 14
        versionName "14.0-frontview-probe"
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
