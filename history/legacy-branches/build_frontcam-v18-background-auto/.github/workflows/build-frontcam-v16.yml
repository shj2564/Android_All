name: Build FrontCamera v16 OEM source2 probe

on:
  push:
    branches:
      - build/frontcam-v16-oem-source2
    paths:
      - ".github/workflows/build-frontcam-v16.yml"
      - "tools/frontcam-v16/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle -p tools/frontcam-v16 :app:assembleDebug --stacktrace

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          APK="tools/frontcam-v16/app/build/outputs/apk/debug/app-debug.apk"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK" | tee tools/frontcam-v16/APK-VERIFY.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | tee tools/frontcam-v16/APK-BADGING.txt
          sha256sum "$APK" | tee tools/frontcam-v16/APK-SHA256.txt
          grep -F "package: name='kr.song.peugeot.frontoemv16'" tools/frontcam-v16/APK-BADGING.txt
          grep -F "targetSdkVersion:'27'" tools/frontcam-v16/APK-BADGING.txt

      - name: Persist build without Actions artifact storage
        shell: bash
        run: |
          set -euo pipefail
          APK="tools/frontcam-v16/app/build/outputs/apk/debug/app-debug.apk"
          OUT="build-artifacts/frontcam-v16"
          mkdir -p "$OUT"
          base64 -w0 "$APK" > "$OUT/CMZX-FrontCamera-v16-OEM-SOURCE2.apk.b64"
          cp tools/frontcam-v16/APK-VERIFY.txt "$OUT/"
          cp tools/frontcam-v16/APK-BADGING.txt "$OUT/"
          cp tools/frontcam-v16/APK-SHA256.txt "$OUT/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "Persist v16 OEM source2 build"
            git push
          fi
