name: Build FrontCamera v14 FrontView probe

on:
  push:
    branches:
      - build/frontcam-v14-frontview-probe
    paths:
      - ".github/workflows/build-frontcam-v14.yml"
      - "tools/frontcam-v14/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle -p tools/frontcam-v14 :app:assembleDebug --stacktrace

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          APK="tools/frontcam-v14/app/build/outputs/apk/debug/app-debug.apk"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK" | tee tools/frontcam-v14/APK-VERIFY.txt
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | tee tools/frontcam-v14/APK-BADGING.txt
          sha256sum "$APK" | tee tools/frontcam-v14/APK-SHA256.txt
          grep -F "package: name='kr.song.peugeot.frontviewv14'" tools/frontcam-v14/APK-BADGING.txt
          grep -F "targetSdkVersion:'27'" tools/frontcam-v14/APK-BADGING.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: frontcam-v14-frontview-probe
          path: |
            tools/frontcam-v14/app/build/outputs/apk/debug/app-debug.apk
            tools/frontcam-v14/APK-VERIFY.txt
            tools/frontcam-v14/APK-BADGING.txt
            tools/frontcam-v14/APK-SHA256.txt
          if-no-files-found: error
