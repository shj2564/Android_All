plugins {
    id "com.android.application"
}

android {
    namespace "kr.song.peugeot.frontpathv11"
    compileSdk 35

    defaultConfig {
        applicationId "kr.song.peugeot.frontpathv11"
        minSdk 21
        targetSdk 27
        versionCode 11
        versionName "11.0-source"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
