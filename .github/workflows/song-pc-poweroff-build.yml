name: Build SoNG PC PowerOff APK
on:
  pull_request:
    paths:
      - 'SoNG_PC_PowerOff/**'
      - '.github/workflows/song-pc-poweroff-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: SoNG_PC_PowerOff
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SoNG-PC-PowerOff-v1
          path: SoNG_PC_PowerOff/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
