name: Build MassageRepair APK

on:
  push:
    branches: [main]
    paths:
      - 'massagecheck/**'
      - '!massagecheck/dist/**'
      - '.github/workflows/massagecheck-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        working-directory: massagecheck
        run: gradle :app:assembleRelease --stacktrace
      - name: Sign stable-key APK and verify
        env:
          KEY_B64: ${{ secrets.ANDROID_ALL_MASSAGE_SIGNING_B64 }}
          KS_PASS: ${{ secrets.ANDROID_ALL_MASSAGE_SIGNING_PASS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KS_PASS"
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/massage.p12"
          chmod 600 "$RUNNER_TEMP/massage.p12"
          mkdir -p massagecheck/dist
          BTOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BTOOLS/zipalign" -f 4 massagecheck/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/massage-aligned.apk"
          "$BTOOLS/apksigner" sign --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --ks "$RUNNER_TEMP/massage.p12" --ks-key-alias massage --ks-pass env:KS_PASS --key-pass env:KS_PASS --out massagecheck/dist/CMZX-MassageRepair-v03.apk "$RUNNER_TEMP/massage-aligned.apk"
          "$BTOOLS/apksigner" verify --verbose --print-certs massagecheck/dist/CMZX-MassageRepair-v03.apk
          sha256sum massagecheck/dist/CMZX-MassageRepair-v03.apk | tee massagecheck/dist/CMZX-MassageRepair-v03.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMZX-MassageRepair-v03
          path: |
            massagecheck/dist/CMZX-MassageRepair-v03.apk
            massagecheck/dist/CMZX-MassageRepair-v03.sha256
          if-no-files-found: error
      - name: Commit signed APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add massagecheck/dist/CMZX-MassageRepair-v03.apk massagecheck/dist/CMZX-MassageRepair-v03.sha256
          git commit -m "Add stable-signed MassageRepair v03 APK" || exit 0
          git push origin HEAD:main
