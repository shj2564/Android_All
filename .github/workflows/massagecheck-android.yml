name: Build MassageRepair APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'massagecheck/dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: massagecheck
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p massagecheck/dist
          cp massagecheck/app/build/outputs/apk/debug/app-debug.apk massagecheck/dist/CMZX-MassageRepair-v02.apk
          sha256sum massagecheck/dist/CMZX-MassageRepair-v02.apk | tee massagecheck/dist/CMZX-MassageRepair-v02.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMZX-MassageRepair-v02
          path: |
            massagecheck/dist/CMZX-MassageRepair-v02.apk
            massagecheck/dist/CMZX-MassageRepair-v02.sha256
          if-no-files-found: error
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add massagecheck/dist/CMZX-MassageRepair-v02.apk massagecheck/dist/CMZX-MassageRepair-v02.sha256
          git commit -m "Add built MassageRepair v02 APK" || exit 0
          git push origin HEAD:main
