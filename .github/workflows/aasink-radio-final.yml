name: Build CMZX AASink Real FM Bridge DEX

on:
  push:
    branches:
      - aasink-radio-final-build-20261027
    paths-ignore:
      - 'build-artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile AA protocol stubs
        run: |
          rm -rf /tmp/cmzx-build
          mkdir -p /tmp/cmzx-build/stubs /tmp/cmzx-build/adapter /tmp/cmzx-build/dex
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/cmzx-build/stubs             aasink-radio-final/stubs/com/google/android/projection/protocol/Radio.java
          jar cf /tmp/cmzx-build/radio-stubs.jar -C /tmp/cmzx-build/stubs .
      - name: Compile real Reglink FM bridge
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$ANDROID_JAR:/tmp/cmzx-build/radio-stubs.jar"             -d /tmp/cmzx-build/adapter             aasink-radio-final/src/com/google/android/projection/protocol/RadioStub.java
      - name: D8 adapter only
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"             --min-api 17             --lib "$ANDROID_JAR"             --classpath /tmp/cmzx-build/radio-stubs.jar             --output /tmp/cmzx-build/dex             /tmp/cmzx-build/adapter/com/google/android/projection/protocol/RadioStub.class
          test -s /tmp/cmzx-build/dex/classes.dex
      - name: Prepare reproducible artifact
        run: |
          mkdir -p build-artifacts/aasink-radio-final
          base64 -w0 /tmp/cmzx-build/dex/classes.dex > build-artifacts/aasink-radio-final/RadioStub.real-fm.dex.b64
          sha256sum /tmp/cmzx-build/dex/classes.dex | awk '{print $1}' > build-artifacts/aasink-radio-final/RadioStub.real-fm.dex.sha256
          printf '%s\n'             'CMZX65-U1 AASink physical FM bridge'             'Class: com.google.android.projection.protocol.RadioStub'             'Target: yellow.android.aasink_2025091316.apk'             'Radio service: reglink.droid -> IRadioService'             'Build: GitHub Actions / D8 min-api 17'             > build-artifacts/aasink-radio-final/BUILD_INFO.txt
      - name: Commit build artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-artifacts/aasink-radio-final
          git commit -m "Build AASink real FM bridge DEX" || exit 0
          git push origin HEAD:aasink-radio-final-build-20261027
